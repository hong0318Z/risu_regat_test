<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Risu Regex Renderer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#16181c;--bg2:#1e2025;--bg3:#25272e;--bd:#2e3138;--tx:#d4d8e0;--mu:#6b7280;--ac:#7c3aed;--gr:#22c55e;--rd:#ef4444}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:9px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
header h1{font-size:14px;font-weight:600}
.tag{background:var(--ac);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px}

.layout{display:flex;flex:1;overflow:hidden}

/* sidebar */
.sb{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.sb-top{padding:10px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.btn-new{background:var(--ac);color:#fff;border:none;padding:6px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;width:100%}
.btn-new:hover{opacity:.85}
.sb-acts{display:flex;gap:5px}
.btn-xs{flex:1;background:var(--bg3);color:var(--mu);border:1px solid var(--bd);padding:4px;border-radius:4px;cursor:pointer;font-size:10px}
.btn-xs:hover{color:var(--tx);border-color:var(--ac)}
input.search{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:4px;font-size:11px}
input.search:focus{outline:none;border-color:var(--ac)}
input.search::placeholder{color:var(--mu)}
.list{flex:1;overflow-y:auto;padding:5px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.item{padding:8px 9px;border-radius:4px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.item:hover{background:var(--bg3)}
.item.on{background:rgba(124,58,237,.15);border-color:var(--ac)}
.item-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-re{font-size:10px;color:var(--mu);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sb-count{font-size:10px;color:var(--mu);text-align:center;padding:5px;border-top:1px solid var(--bd)}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-scroll{flex:1;overflow-y:auto;padding:18px 22px}
.main-scroll::-webkit-scrollbar{width:4px}
.main-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mu)}
.empty .ico{font-size:36px;opacity:.25}
.empty h2{font-size:14px;color:var(--tx);opacity:.4}
.empty p{font-size:11px;text-align:center;line-height:1.6}

/* form */
.sec{margin-bottom:18px}
.sec-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:600;color:var(--mu);margin-bottom:3px}
.field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);padding:6px 9px;border-radius:4px;font-size:12px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ac)}
.field textarea{resize:vertical;font-family:'Fira Code',monospace;line-height:1.5}
.mono{font-family:'Fira Code','Courier New',monospace!important}
.err{font-size:10px;color:var(--rd);margin-top:2px;display:none}

/* preview */
.preview-box{border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.preview-head{background:var(--bg3);border-bottom:1px solid var(--bd);padding:7px 10px;display:flex;align-items:center;justify-content:space-between}
.preview-head span{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.btn-preview{background:var(--gr);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.btn-preview:hover{opacity:.85}
.preview-frame{background:#fff;min-height:80px;width:100%}
.preview-err{padding:12px;color:var(--rd);font-size:11px;font-family:monospace;background:rgba(239,68,68,.05)}

/* footer */
.foot{display:none;padding:9px 22px;background:var(--bg2);border-top:1px solid var(--bd);gap:7px;align-items:center;flex-shrink:0}
.btn-save{background:var(--ac);color:#fff;border:none;padding:6px 18px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500}
.btn-save:hover{opacity:.85}
.btn-del{display:none;background:none;border:1px solid var(--bd);color:var(--rd);padding:6px 12px;border-radius:5px;cursor:pointer;font-size:12px}
.btn-del:hover{background:rgba(239,68,68,.1);border-color:var(--rd)}
.foot-st{font-size:10px;color:var(--gr);margin-left:auto}

.toasts{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:100}
.toast{background:var(--bg3);border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:5px;font-size:11px;animation:tin .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--gr);color:var(--gr)}
.toast.ng{border-color:var(--rd);color:var(--rd)}
@keyframes tin{from{transform:translateX(14px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<header>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
  <h1>Risu Regex Renderer</h1>
  <span class="tag">Visual Lab</span>
</header>

<div class="layout">

  <div class="sb">
    <div class="sb-top">
      <button class="btn-new" onclick="newItem()">+ 새 항목</button>
      <div class="sb-acts">
        <button class="btn-xs" onclick="exportAll()">내보내기</button>
        <button class="btn-xs" onclick="document.getElementById('imp').click()">가져오기</button>
        <input type="file" id="imp" accept=".json" style="display:none" onchange="importAll(event)">
      </div>
      <input class="search" id="search" placeholder="검색..." oninput="renderList()">
    </div>
    <div class="list" id="list"></div>
    <div class="sb-count" id="count">0개</div>
  </div>

  <div class="main">
    <div class="main-scroll">

      <div class="empty" id="empty">
        <div class="ico">◈</div>
        <h2>항목을 선택하거나 새로 만드세요</h2>
        <p>정규식으로 텍스트를 파싱하고<br>HTML/CSS로 시각적으로 렌더링합니다</p>
      </div>

      <div id="form" style="display:none">

        <div class="sec">
          <div class="sec-title">기본 정보</div>
          <div class="field">
            <label>이름</label>
            <input id="f-name" type="text" placeholder="예: 유튜브 스타일 시계">
          </div>
          <div class="field">
            <label>설명</label>
            <input id="f-desc" type="text" placeholder="어떤 용도의 렌더러인지 설명">
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">정규식 & 샘플</div>
          <div class="field">
            <label>REGEXP — 슬래시 없이 입력, 캡처그룹 () 사용</label>
            <input id="f-re" type="text" class="mono" placeholder="예: \[Time:([^\]]+)\]" oninput="validateRe()">
            <div class="err" id="re-err"></div>
          </div>
          <div class="field">
            <label>SAMPLE — 정규식이 매칭할 예시 텍스트</label>
            <input id="f-sample" type="text" class="mono" placeholder="예: [Time: 10:30:55]">
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">HTML/CSS 코드 — $1, $2... 로 캡처그룹 참조</div>
          <div class="field">
            <textarea id="f-code" rows="10" placeholder="<style>
  .my-widget { background: #282828; color: #fff; padding: 8px 14px; border-radius: 6px; }
</style>
<div class=&quot;my-widget&quot;>⏰ $1</div>"></textarea>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">렌더링 미리보기</div>
          <div class="preview-box">
            <div class="preview-head">
              <span>Preview</span>
              <button class="btn-preview" onclick="runPreview()">▶ 렌더링 (Ctrl+Enter)</button>
            </div>
            <div id="preview-wrap">
              <div style="padding:16px;color:var(--mu);font-size:11px;text-align:center">▶ 렌더링 버튼을 눌러 결과를 확인하세요</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="foot" id="foot">
      <button class="btn-save" onclick="saveItem()">저장 (Ctrl+S)</button>
      <button class="btn-del" id="del-btn" onclick="deleteItem()">삭제</button>
      <span class="foot-st" id="foot-st"></span>
    </div>
  </div>

</div>

<div class="toasts" id="toasts"></div>

<script>
const KEY = 'risu_renderer_v1';
let data = [];
let activeId = null;

function load() { try { data = JSON.parse(localStorage.getItem(KEY)) || []; } catch { data = []; } }
function persist() { localStorage.setItem(KEY, JSON.stringify(data)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

/* list */
function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = data.filter(r =>
    (r.name||'').toLowerCase().includes(q) ||
    (r.regexp||'').toLowerCase().includes(q) ||
    (r.desc||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('list');
  el.innerHTML = filtered.length
    ? filtered.map(r => `
        <div class="item${r.id===activeId?' on':''}" onclick="select('${r.id}')">
          <div class="item-name">${esc(r.name||'이름 없음')}</div>
          <div class="item-re">/${esc(r.regexp||'')}/</div>
        </div>`).join('')
    : `<div style="padding:14px;text-align:center;color:var(--mu);font-size:10px">${q?'검색 결과 없음':'항목 없음'}</div>`;
  document.getElementById('count').textContent = data.length + '개';
}

/* select */
function select(id) {
  activeId = id;
  const r = data.find(x => x.id === id);
  if (!r) return;
  document.getElementById('f-name').value   = r.name   || '';
  document.getElementById('f-desc').value   = r.desc   || '';
  document.getElementById('f-re').value     = r.regexp || '';
  document.getElementById('f-sample').value = r.sample || '';
  document.getElementById('f-code').value   = r.code   || '';
  showForm(true);
  resetPreview();
  validateRe();
  renderList();
}

/* new */
function newItem() {
  activeId = null;
  document.getElementById('f-name').value   = '';
  document.getElementById('f-desc').value   = '';
  document.getElementById('f-re').value     = '';
  document.getElementById('f-sample').value = '';
  document.getElementById('f-code').value   = '';
  showForm(false);
  resetPreview();
  document.getElementById('foot-st').textContent = '';
  renderList();
  document.getElementById('f-name').focus();
}

function showForm(existing) {
  document.getElementById('empty').style.display = 'none';
  document.getElementById('form').style.display  = 'block';
  document.getElementById('foot').style.display  = 'flex';
  document.getElementById('del-btn').style.display = existing ? 'block' : 'none';
}

/* validate */
function validateRe() {
  const p = document.getElementById('f-re').value;
  const el = document.getElementById('re-err');
  if (!p) { el.style.display='none'; return true; }
  try { new RegExp(p); el.style.display='none'; return true; }
  catch(e) { el.style.display='block'; el.textContent='⚠ '+e.message; return false; }
}

/* preview */
function runPreview() {
  const reStr = document.getElementById('f-re').value.trim();
  const sample = document.getElementById('f-sample').value;
  const code = document.getElementById('f-code').value;
  const wrap = document.getElementById('preview-wrap');

  if (!reStr) { toast('정규식을 입력하세요','ng'); return; }
  if (!validateRe()) { toast('유효하지 않은 정규식','ng'); return; }
  if (!code.trim()) { toast('HTML/CSS 코드를 입력하세요','ng'); return; }

  let re;
  try { re = new RegExp(reStr); } catch(e) { showPreviewErr(e.message); return; }

  const m = sample.match(re);
  if (!m) {
    wrap.innerHTML = `<div class="preview-err">매칭 없음 — SAMPLE 텍스트가 REGEXP와 일치하지 않습니다</div>`;
    return;
  }

  // replace $1 $2 ... in code
  let rendered = code;
  for (let i = 1; i < m.length; i++) {
    rendered = rendered.split('$'+i).join(esc(m[i]||''));
  }

  // render in iframe
  const iframe = document.createElement('iframe');
  iframe.className = 'preview-frame';
  iframe.setAttribute('sandbox', 'allow-same-origin');
  iframe.style.border = 'none';
  iframe.style.width = '100%';
  wrap.innerHTML = '';
  wrap.appendChild(iframe);

  // write after append
  iframe.contentDocument.open();
  iframe.contentDocument.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>body{margin:12px;background:#fff;font-family:system-ui,sans-serif}</style>
  </head><body>${rendered}</body></html>`);
  iframe.contentDocument.close();

  // auto height
  iframe.onload = () => {
    try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 24 + 'px'; } catch{}
  };
  setTimeout(() => {
    try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 24 + 'px'; } catch{}
  }, 100);
}

function showPreviewErr(msg) {
  document.getElementById('preview-wrap').innerHTML = `<div class="preview-err">오류: ${esc(msg)}</div>`;
}

function resetPreview() {
  document.getElementById('preview-wrap').innerHTML =
    '<div style="padding:16px;color:var(--mu);font-size:11px;text-align:center">▶ 렌더링 버튼을 눌러 결과를 확인하세요</div>';
}

/* save */
function saveItem() {
  const name = document.getElementById('f-name').value.trim();
  const re   = document.getElementById('f-re').value.trim();
  if (!name) { toast('이름을 입력하세요','ng'); document.getElementById('f-name').focus(); return; }
  if (!re)   { toast('정규식을 입력하세요','ng'); document.getElementById('f-re').focus(); return; }
  if (!validateRe()) { toast('유효하지 않은 정규식','ng'); return; }

  const item = {
    id: activeId || uid(),
    name,
    desc:   document.getElementById('f-desc').value.trim(),
    regexp: re,
    sample: document.getElementById('f-sample').value,
    code:   document.getElementById('f-code').value,
    updatedAt: new Date().toISOString(),
  };

  if (!activeId) {
    item.createdAt = item.updatedAt;
    data.push(item);
    activeId = item.id;
    document.getElementById('del-btn').style.display = 'block';
  } else {
    const i = data.findIndex(x => x.id === activeId);
    if (i >= 0) data[i] = {...data[i], ...item};
  }
  persist(); renderList();
  const st = document.getElementById('foot-st');
  st.textContent = '✓ 저장됨';
  setTimeout(() => st.textContent='', 2000);
  toast(`"${name}" 저장 완료`, 'ok');
}

/* delete */
function deleteItem() {
  if (!activeId) return;
  const r = data.find(x => x.id === activeId);
  if (!r || !confirm(`"${r.name}" 을(를) 삭제할까요?`)) return;
  data = data.filter(x => x.id !== activeId);
  persist(); activeId = null;
  document.getElementById('empty').style.display = 'flex';
  document.getElementById('form').style.display  = 'none';
  document.getElementById('foot').style.display  = 'none';
  renderList(); toast('삭제됨','ok');
}

/* export / import */
function exportAll() {
  if (!data.length) { toast('내보낼 항목 없음','ng'); return; }
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),
    download: `risu_renderer_${new Date().toISOString().slice(0,10)}.json`
  });
  a.click(); toast(`${data.length}개 내보내기`,'ok');
}
function importAll(e) {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ev => {
    try {
      const arr = JSON.parse(ev.target.result);
      if (!Array.isArray(arr)) throw new Error('배열 형식 아님');
      let added=0;
      arr.forEach(r => { if(r.id && !data.find(x=>x.id===r.id)){data.push(r);added++;} });
      persist(); renderList(); toast(`${added}개 가져오기`,'ok');
    } catch(err) { toast('가져오기 실패: '+err.message,'ng'); }
  };
  fr.readAsText(f); e.target.value='';
}

/* toast */
function toast(msg, cls='') {
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+cls; el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},2400);
}

/* utils */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* shortcuts */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='s'){e.preventDefault();if(document.getElementById('form').style.display!=='none')saveItem();}
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter'){e.preventDefault();if(document.getElementById('form').style.display!=='none')runPreview();}
});

load(); renderList();
</script>
</body>
</html>
